; ESP32 control project. Pick your chip with `default_envs` (run `esp --detect` if unsure).
;   esp32     classic ESP32: ESP32-WROOM-32, "ESP32 DevKit V1", NodeMCU-32S, most $5-10 boards
;   esp32-s3  ESP32-S3 boards (DevKitC-1, S3 Zero/Super Mini, ...)
;   esp32-c3  ESP32-C3 boards (DevKitM-1, C3 Super Mini, ...)

[platformio]
default_envs = esp32
; Build output lives outside OneDrive: syncing thousands of build files is slow and
; OneDrive file locks cause random "permission denied" build failures.
workspace_dir = ${platformio.core_dir}/workspaces/meiners-esp32

[env]
platform = espressif32
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF
; Keep DTR/RTS low so opening the monitor doesn't hold the board in reset.
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder

[env:esp32]
board = esp32dev
build_flags = -D LED_PIN=2

[env:esp32-s3]
board = esp32-s3-devkitc-1
; The firmware answers on BOTH the native USB port and the UART/"COM" port.
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-c3]
board = esp32-c3-devkitm-1
; C3 Super Mini: blue LED on GPIO8, lit when LOW. (DevKitM-1 has an RGB LED on GPIO8 instead:
; delete the two LED flags to use it.)
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D LED_PIN=8 -D LED_ACTIVE_LOW=1
