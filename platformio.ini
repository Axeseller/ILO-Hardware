; Steren "Placa de programación tipo ESP32": original ESP32, 4 MB flash,
; CP2102 USB-UART on /dev/ttyUSB0. Same family as the DOIT ESP32 DEVKIT V1.
; That variant defines LED_BUILTIN as GPIO 2. The generic esp32dev variant does not.
; Environment name is esp32doit-devkit-v1. A later .clangd query-driver path depends on it.

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; 460800 connected, then the flasher stub never answered. 115200 is slower and more reliable on this CP2102.
upload_speed = 115200
