; Focus device firmware: an ESP32 that senses how close your phone is.
; Pick your chip with `default_envs` (the PC app's "Detect board" button tells you which).
;   esp32     classic ESP32 (ESP32-WROOM-32, "ESP32 DevKit V1", NodeMCU-32S, ...)
;   esp32-s3  ESP32-S3 boards
;   esp32-c3  ESP32-C3 boards
; (ESP32-S2 has no Bluetooth, so it can't be used.)

[platformio]
default_envs = esp32
src_dir = firmware
; Build output lives outside OneDrive: syncing build files is slow and causes file-lock errors.
workspace_dir = ${platformio.core_dir}/workspaces/meiners-focus-device

[env]
platform = espressif32
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@2.5.2
; 460800 failed on the partner's board (Steren ESP32, CP2102 USB chip): it connected, then the
; flasher never answered. 115200 is slower (about 30-60 s more); it worked on the user's CP2102 board too.
upload_speed = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder
build_flags = -Wall

[env:esp32]
board = esp32dev
build_flags = ${env.build_flags} -D LED_PIN=2 -D BUTTON_PIN=0

[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -D ARDUINO_USB_CDC_ON_BOOT=1 -D BUTTON_PIN=0

[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1 -D LED_PIN=8 -D LED_ACTIVE_LOW=1 -D BUTTON_PIN=9
